<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Café - Online Food Ordering System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>Campus Café Order Form</h2>

        <form id="myForm">

             <fieldset>
                <legend>Personal Information</legend>   
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name">
            <small id="nameError" class="error"></small>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="example@gmail.com">
            <small id="emailError" class="error"></small>

            <label for="phone">Phone Number</label>
            <input type="text" id="phone" placeholder="Enter phone number">
            <small id="phoneError" class="error"></small>

            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" placeholder="e.g. 23-12345-1">
            <small id="studentIdError" class="error"></small>

            <label>Gender</label>
            <div class="radio-group">
                <input type="radio" id="male" name="gender" value="Male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>
                <input type="radio" id="other" name="gender" value="Other">
                <label for="other">Other</label>    
            </div>
            <small id="genderError" class="error"></small>

            <label for="department">Department</label>
            <select id="department">
                <option value="">-- Select Department --</option>
                <option value="CSE">CSE</option>
                <option value="EEE">EEE</option>
                <option value="BBA">BBA</option>
                <option value="English">English</option>
                <option value="Other">Other</option>
            </select>
            <small id="departmentError" class="error"></small>
             </fieldset>

             <fieldset>
                <legend>Food Selection</legend>
            <label>Food Items</label>
            <div class="checkbox-group">
                <div class="food-item">
                    <input type="checkbox" id="burger" name="food" value="Burger" data-price="5">
                    <label for="burger">Burger - $5</label>
                </div>
                <div class="food-item">
                    <input type="checkbox" id="pizza" name="food" value="Pizza" data-price="8">
                    <label for="pizza">Pizza - $8</label>
                </div>
                <div class="food-item">
                    <input type="checkbox" id="sandwich" name="food" value="Sandwich" data-price="4">
                    <label for="sandwich">Sandwich - $4</label>
                </div>
                <div class="food-item">
                    <input type="checkbox" id="fries" name="food" value="French Fries" data-price="3">
                    <label for="fries">French Fries - $3</label>
                </div>
                <div class="food-item">
                    <input type="checkbox" id="coffee" name="food" value="Coffee" data-price="2">
                    <label for="coffee">Coffee - $2</label>
                </div>
                <div class="food-item">
                    <input type="checkbox" id="coldDrink" name="food" value="Cold Drink" data-price="2">
                    <label for="coldDrink">Cold Drink - $2</label>
                </div>
            </div>
            <small id="foodError" class="error"></small>

            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" placeholder="Enter quantity" min="1">
            <small id="quantityError" class="error"></small>

            <label for="instructions">Special Instructions (Optional)</label>
            <textarea id="instructions" rows="3" placeholder="Any special requests..."></textarea>
             </fieldset>

            <button type="submit">Place Order</button>

        </form>

        <div id="orderOutput" class="order-summary" style="display: none;"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
